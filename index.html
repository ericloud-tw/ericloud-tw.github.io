<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ericloud</title>
<meta name="theme-color" content="#04070f">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; background: #04070f; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<script>
const TAU = Math.PI * 2;
const T = 36, K = 9;
const c = document.getElementById('c'), x = c.getContext('2d');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, dpr, S, A, CY, FX, cell, nodes, edges, packets, feeders, glow, vignette;

const clamp = v => v < 0 ? 0 : v > 1 ? 1 : v;
const easeInOut = v => v < 0.5 ? 4 * v * v * v : 1 - (-2 * v + 2) ** 3 / 2;
const easeOutBack = v => 1 + 2.4 * (v - 1) ** 3 + 1.4 * (v - 1) ** 2;
const mod = (n, m) => ((n % m) + m) % m;
function hash(n) {
  n = Math.imul(n ^ 0x9e3779b9, 0x85ebca6b); n ^= n >>> 13;
  n = Math.imul(n, 0xc2b2ae35); n ^= n >>> 16;
  return n >>> 0;
}
function rng(seed) {
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function setup() {
  const r = rng(1401);
  S = Math.max(96, Math.min(200, Math.min(W, H) * 0.24));
  A = S * 0.34;
  CY = H * 0.5;
  FX = W * 0.64;

  cell = Math.max(80, Math.sqrt(W * H / 70));
  const cols = Math.ceil(W / cell) + 2, rows = Math.ceil(H / cell) + 2;
  nodes = [];
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const hub = r() < 0.08;
    nodes.push({
      bx: (i - 1 + r()) * cell, by: (j - 1 + r()) * cell,
      ax: cell * (0.08 + r() * 0.2), ay: cell * (0.08 + r() * 0.2),
      kx: 1 + (r() * 2 | 0), ky: 1 + (r() * 2 | 0),
      px: r() * TAU, py: r() * TAU, hub, rad: hub ? 2.4 : 1 + r() * 0.8, ph: r()
    });
  }
  edges = [];
  const seen = new Set();
  nodes.forEach((a, ia) => {
    nodes.map((b, ib) => [(a.bx - b.bx) ** 2 + (a.by - b.by) ** 2, ib])
      .sort((p, q) => p[0] - q[0]).slice(1, 4)
      .forEach(([, ib]) => {
        const k = ia < ib ? ia + ':' + ib : ib + ':' + ia;
        if (!seen.has(k)) { seen.add(k); edges.push({ a: ia, b: ib, ph: r() }); }
      });
  });
  packets = edges.filter(() => r() < 0.16).map(e => ({ e, m: 3 + (r() * 4 | 0), off: r(), fwd: r() < 0.5 }));
  const byDist = nodes.map((nd, i) => [Math.hypot(nd.bx - FX, (nd.by - CY) * 1.3), i]).sort((p, q) => p[0] - q[0]);
  feeders = byDist.filter(([d]) => d > S * 0.9 && d < S * 3.2).slice(0, 28).map(([, i]) => i);
  if (feeders.length < 6) feeders = byDist.slice(2, 14).map(([, i]) => i);

  glow = x.createRadialGradient(FX, CY, 0, FX, CY, S * 1.4);
  glow.addColorStop(0, 'rgba(34,211,238,0.16)');
  glow.addColorStop(1, 'rgba(34,211,238,0)');
  vignette = x.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.hypot(W, H) * 0.6);
  vignette.addColorStop(0, 'rgba(2,4,9,0)');
  vignette.addColorStop(1, 'rgba(2,4,9,0.82)');
}

function pos(n, t) {
  return [n.bx + n.ax * Math.cos(TAU * n.kx * t + n.px), n.by + n.ay * Math.sin(TAU * n.ky * t + n.py)];
}
const bandFade = y => 0.3 + 0.7 * clamp(Math.abs(y - CY) / (H * 0.22));

function poly(pts, fill) {
  x.fillStyle = fill;
  x.beginPath();
  x.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) x.lineTo(pts[i][0], pts[i][1]);
  x.closePath();
  x.fill();
}

function cube(cx, cy, a, pat, al, lit) {
  if (al <= 0 || a <= 0) return;
  const w = a * 0.866, hue = 188 + (pat >>> 20) % 60;
  poly([[cx, cy - a], [cx + w, cy - a / 2], [cx + w, cy + a / 2], [cx, cy + a], [cx - w, cy + a / 2], [cx - w, cy - a / 2]], `rgba(4,7,15,${0.85 * al})`);
  poly([[cx, cy - a], [cx + w, cy - a / 2], [cx, cy], [cx - w, cy - a / 2]], `hsla(${hue},85%,${60 + lit * 20}%,${(0.22 + lit * 0.3) * al})`);
  poly([[cx - w, cy - a / 2], [cx, cy], [cx, cy + a], [cx - w, cy + a / 2]], `hsla(${hue},80%,${45 + lit * 20}%,${(0.14 + lit * 0.25) * al})`);
  poly([[cx, cy], [cx + w, cy - a / 2], [cx + w, cy + a / 2], [cx, cy + a]], `hsla(${hue},80%,${35 + lit * 20}%,${(0.09 + lit * 0.2) * al})`);
  x.strokeStyle = `hsla(${hue},95%,${72 + lit * 18}%,${0.75 * al})`;
  x.lineWidth = 1.2;
  x.beginPath();
  x.moveTo(cx, cy - a); x.lineTo(cx + w, cy - a / 2); x.lineTo(cx + w, cy + a / 2);
  x.lineTo(cx, cy + a); x.lineTo(cx - w, cy + a / 2); x.lineTo(cx - w, cy - a / 2); x.closePath();
  x.moveTo(cx - w, cy - a / 2); x.lineTo(cx, cy); x.lineTo(cx + w, cy - a / 2);
  x.moveTo(cx, cy); x.lineTo(cx, cy + a);
  x.stroke();
  [[cx - w, cy - a / 2, w, a / 2], [cx, cy, w, -a / 2]].forEach(([ox, oy, ux, uy], fi) => {
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
      const on = (pat >>> (fi * 9 + i * 3 + j)) & 1, u = 0.25 + i * 0.25, v = 0.25 + j * 0.25;
      x.fillStyle = on ? `hsla(${hue},100%,${80 + lit * 15}%,${0.9 * al})` : `hsla(${hue},80%,70%,${0.12 * al})`;
      x.beginPath(); x.arc(ox + u * ux, oy + u * uy + v * a, a * 0.045, 0, TAU); x.fill();
    }
  });
}

function link(x1, x2, cy, a, al) {
  if (x2 <= x1 || al <= 0) return;
  const gap = a * 0.09;
  x.strokeStyle = `rgba(125,211,252,${0.55 * al})`;
  x.lineWidth = 1.2;
  x.beginPath();
  x.moveTo(x1, cy - gap); x.lineTo(x2, cy - gap);
  x.moveTo(x1, cy + gap); x.lineTo(x2, cy + gap);
  x.stroke();
}

function draw(t) {
  x.fillStyle = '#04070f';
  x.fillRect(0, 0, W, H);

  const cyc = t * K, ci = Math.floor(cyc), cf = cyc - ci;
  const sh = easeInOut(clamp(cf / 0.28));
  const p = clamp((cf - 0.42) / 0.36);
  const lockQ = clamp((cf - 0.8) / 0.2);
  const lit = p * (1 - lockQ);
  const w = A * 0.866;
  const alAt = cx => clamp((cx + w) / (W * 0.3));
  const seed = mod(ci, K);

  const P = nodes.map(n => pos(n, t));
  x.lineWidth = 1;
  for (const e of edges) {
    const a = P[e.a], b = P[e.b];
    const al = (0.05 + 0.07 * (0.5 + 0.5 * Math.sin(TAU * (2 * t + e.ph)))) * bandFade((a[1] + b[1]) / 2);
    x.strokeStyle = `rgba(125,170,255,${al.toFixed(3)})`;
    x.beginPath(); x.moveTo(a[0], a[1]); x.lineTo(b[0], b[1]); x.stroke();
  }
  for (const pk of packets) {
    const s = (pk.m * t + pk.off) % 1;
    if (s > 0.55) continue;
    const u = s / 0.55, a = P[pk.fwd ? pk.e.a : pk.e.b], b = P[pk.fwd ? pk.e.b : pk.e.a];
    const hx = a[0] + (b[0] - a[0]) * u, hy = a[1] + (b[1] - a[1]) * u;
    const fade = Math.min(1, u * 5, (1 - u) * 5) * bandFade(hy);
    x.fillStyle = `rgba(103,232,249,${(0.8 * fade).toFixed(3)})`;
    x.beginPath(); x.arc(hx, hy, 1.7, 0, TAU); x.fill();
  }

  const emit = new Map();
  const shots = [];
  for (let k = 0; k < 16; k++) {
    const h = hash(seed * 64 + k + 7);
    const st = 0.2 + (h % 1000) / 1000 * 0.22;
    const q = clamp((cf - st) / 0.32);
    if (q <= 0 || q >= 1) continue;
    const ni = feeders[(h >>> 12) % feeders.length];
    shots.push([ni, q]);
    emit.set(ni, Math.max(emit.get(ni) || 0, 1 - q));
  }

  nodes.forEach((n, i) => {
    const [px, py] = P[i], bf = bandFade(py), em = emit.get(i) || 0;
    if (n.hub || em > 0) {
      const R = 20 + em * 14;
      const halo = x.createRadialGradient(px, py, 0, px, py, R);
      halo.addColorStop(0, `rgba(56,189,248,${((n.hub ? 0.22 : 0) + 0.4 * em) * bf})`);
      halo.addColorStop(1, 'rgba(56,189,248,0)');
      x.fillStyle = halo;
      x.beginPath(); x.arc(px, py, R, 0, TAU); x.fill();
    }
    if (n.hub) {
      const s = (4 * t + n.ph) % 1;
      x.strokeStyle = `rgba(125,211,252,${(0.35 * (1 - s) ** 2 * bf).toFixed(3)})`;
      x.beginPath(); x.arc(px, py, n.rad + 4 + s * 24, 0, TAU); x.stroke();
    }
    x.fillStyle = em > 0 ? `rgba(207,250,254,${0.7 + 0.3 * em})` : `rgba(160,200,255,${(0.65 * bf).toFixed(3)})`;
    x.beginPath(); x.arc(px, py, n.rad + em * 1.2, 0, TAU); x.fill();
  });

  x.globalAlpha = 0.45 + 0.55 * lit;
  x.fillStyle = glow;
  x.fillRect(0, 0, W, H);
  x.globalAlpha = 1;

  for (const [ni, q] of shots) {
    const [sx, sy] = P[ni];
    const e = q * q * q, e0 = Math.max(0, q - 0.1) ** 3;
    const px = sx + (FX - sx) * e, py = sy + (CY - sy) * e;
    const qx = sx + (FX - sx) * e0, qy = sy + (CY - sy) * e0;
    const al = Math.sin(Math.PI * q);
    x.strokeStyle = `rgba(103,232,249,${(0.1 * al).toFixed(3)})`;
    x.lineWidth = 1;
    x.beginPath(); x.moveTo(sx, sy); x.lineTo(px, py); x.stroke();
    x.strokeStyle = `rgba(165,243,252,${(0.5 * al).toFixed(3)})`;
    x.lineWidth = 1.4;
    x.beginPath(); x.moveTo(qx, qy); x.lineTo(px, py); x.stroke();
    x.fillStyle = `rgba(207,250,254,${(0.95 * al).toFixed(3)})`;
    x.beginPath(); x.arc(px, py, 2, 0, TAU); x.fill();
  }

  const n = Math.ceil(FX / S) + 2;
  for (let r = n; r >= 0; r--) {
    const cx = FX - S * r - S * sh, al = alAt(cx);
    if (al <= 0) continue;
    if (r > 0) link(cx + w, cx + S - w, CY, A, al);
    cube(cx, CY, A, hash(mod(ci - 1 - r, K)), al, 0);
  }
  const lp = clamp((cf - 0.7) / 0.15);
  const lx = FX - S * sh + w;
  link(lx, lx + (FX - w - lx) * lp, CY, A, alAt(FX - S * sh));

  if (p > 0) cube(FX, CY, A * (0.55 + 0.45 * easeOutBack(p)), hash(seed), Math.min(1, p * 1.6), lit);

  if (lockQ > 0 && lockQ < 1) {
    for (let k = 0; k < 2; k++) {
      const q = clamp(lockQ * 1.3 - k * 0.3);
      if (q <= 0 || q >= 1) continue;
      const rr = A * (1.1 + q * 1.8);
      x.strokeStyle = `rgba(165,243,252,${(0.55 * (1 - q) ** 2).toFixed(3)})`;
      x.lineWidth = 1.2;
      x.beginPath(); x.ellipse(FX, CY, rr, rr * 0.58, 0, 0, TAU); x.stroke();
    }
  }

  x.fillStyle = vignette;
  x.fillRect(0, 0, W, H);
}

let ready = false;
function resize() {
  if (!innerWidth || !innerHeight) return;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  setup();
  ready = true;
  if (still) draw(0.79 / K);
}
function frame(ms) { if (ready) draw(ms / 1000 % T / T); requestAnimationFrame(frame); }
addEventListener('resize', resize);
resize();
if (!still) requestAnimationFrame(frame);
</script>
</body>
</html>
